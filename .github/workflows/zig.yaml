name: Zig
on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - decoder/**

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install zig
      uses: mlugg/setup-zig@v1
      with:
        version: 0.13.0

    - name: Format
      run: zig fmt --check .

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install python design tools
      run: |
        python -m pip install -e ./design/

    - name: Generate secrets
      run: |
        python -m ectf25_design.gen_secrets -f global.secrets 1 2 3

    - name: Install zig
      uses: mlugg/setup-zig@v1
      with:
        version: 0.13.0

    - name: Run tests
      working-directory: decoder
      env:
        DECODER_ID: "0xdeadbeef"
      run: zig build test --summary all

  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install python design tools
      run: |
        python -m pip install -e ./design/

    - name: Generate secrets
      run: |
        python -m ectf25_design.gen_secrets -f global.secrets 1 2 3

    - name: Install zig
      uses: mlugg/setup-zig@v1
      with:
        version: 0.13.0

    - name: Install msdk
      run: |
        git clone --depth=1 --branch v2024_02 https://github.com/Analog-Devices-MSDK/msdk
        echo "MAXIM_PATH=$PWD/msdk" >> $GITHUB_ENV

    - name: Install ed25519
      run: |
        git clone --depth=1 https://github.com/orlp/ed25519
        echo "ED25519_PATH=$PWD/ed25519" >> $GITHUB_ENV

    - name: Install ARM GCC
      run: |
        sudo apt-get install -y gcc-arm-none-eabi

    - name: Build documentation
      working-directory: decoder
      env:
        DECODER_ID: "0xdeadbeef"
      run: zig build docs

    - name: Upload static files as artifact
      id: deployment
      uses: actions/upload-pages-artifact@v3
      with:
        path: decoder/docs/

  deploy:
    name: Deploy Documentation
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: docs
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
